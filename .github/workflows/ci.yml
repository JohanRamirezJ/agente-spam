name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agente-spam .
      - run: |
          docker run -d -p 8000:8000 --name app agente-spam
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break || sleep 1; done
          curl -fs -X POST localhost:8000/predict -H 'content-type: application/json' -d '{"text":"You won a free prize, click now"}'
